name: clang-tidy

on:
  push:
    branches:
      - master  # Trigger workflow on every push to main

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      PATH: /usr/lib/llvm-21/bin:${PATH}   # Make LLVM 21 available to all steps
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache build and clang-tidy outputs
      - name: Cache build and Clang-Tidy
        uses: actions/cache@v3
        with:
          path: |
            build
            ~/.cache/clang-tidy
          key: clang-tidy-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp') }}
          restore-keys: clang-tidy-${{ runner.os }}-

      # Install LLVM 21 via llvm.sh
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          clang --version
          clang-tidy --version

      # Install CMake, Ninja, and required libraries
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build libedit-dev libcurl4-openssl-dev libffi-dev zlib1g-dev libxml2-dev libtinfo-dev libzstd-dev

      # Configure the project with CMake
      - name: Configure project with CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Run clang-tidy in parallel
      - name: Run clang-tidy (parallel)
        run: |
          CPU_CORES=$(nproc)
          echo "Running clang-tidy on $CPU_CORES cores..."
          ./tools/run-clang-tidy.sh $CPU_CORES | tee build/clang-tidy.log

      # Upload clang-tidy log only if it fails
      - name: Upload clang-tidy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: build/clang-tidy.log
