name: clang-tidy

on:
  push:
    branches:
      - master

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      PATH: /usr/lib/llvm-21/bin:${PATH}   # Ensure LLVM 21 is visible to all steps
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install basic utilities before LLVM
      - name: Install basic utilities
        run: |
          sudo apt update
          sudo apt install -y tar wget curl xz-utils
          
      # Install LLVM 21 using llvm.sh
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          clang --version
          clang-tidy --version

      # Install CMake and Ninja
      - name: Install CMake and Ninja
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build

      # Install other required libraries
      - name: Install dependencies
        run: |
          sudo apt install -y libedit-dev libcurl4-openssl-dev libffi-dev zlib1g-dev libxml2-dev libtinfo-dev libzstd-dev

      # Configure the project with CMake
      - name: Configure project with CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Run clang-tidy in parallel
      - name: Run clang-tidy (parallel)
        run: |
          CPU_CORES=$(nproc)
          echo "Running clang-tidy on $CPU_CORES cores..."
          ./tools/run-clang-tidy.sh $CPU_CORES | tee build/clang-tidy.log

      # Upload clang-tidy log only if it fails
      - name: Upload clang-tidy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: build/clang-tidy.log
