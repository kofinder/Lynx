name: clang-tidy

on:
  pull_request:
    paths:
      - '**.cpp'
      - '**.hpp'
      - 'src/**'

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build and CMake
        uses: actions/cache@v3
        with:
          path: |
            build
            ~/.cache/clang-tidy
          key: clang-tidy-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp') }}
          restore-keys: clang-tidy-${{ runner.os }}-

      - name: Install Clang/LLVM
        run: |
          sudo apt update
          sudo apt install -y clang clang-tidy cmake ninja-build

      - name: Configure project with CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: ./tools/run-clang-tidy.sh 4 | tee build/clang-tidy.log

      - name: Upload clang-tidy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: build/clang-tidy.log
