# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "feature/types-utilities" ]
  pull_request:
    branches: [ "feature/types-utilities" ]
  schedule:
    - cron: '24 23 * * 4'

jobs:
  analyze:
    name: Analyze C++ code with CodeQL
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [ 'cpp' ]

    steps:
    # -----------------------------------------------------
    # 1. Checkout repository
    # -----------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # -----------------------------------------------------
    # 2. Initialize CodeQL v3
    # -----------------------------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # -----------------------------------------------------
    # 3. Install LLVM / Clang dependencies
    # -----------------------------------------------------
    - name: Install LLVM and Clang
      run: |
        sudo apt update
        sudo apt install -y clang llvm libclang-dev cmake build-essential

    # -----------------------------------------------------
    # 4. Build project and generate compile_commands.json
    # -----------------------------------------------------
    - name: Build C++ project (CMake)
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
        cmake --build .

    # -----------------------------------------------------
    # 5. Perform CodeQL Analysis (v3)
    # -----------------------------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

