# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Analysis Advanced"

on:
    pull_request:
      branches:
        - master
      paths:
        - '**/*.cpp'
        - '**/*.hpp'
        - 'src/**'
    push:
      branches:
        - master  # Optional: run on push
    schedule:
        - cron: '24 23 * * 4'
    
jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------
      # 1. Setup SSH for private repo/submodule access
      # -----------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # -----------------------------------------------------
      # 2. Checkout repository with submodules
      # -----------------------------------------------------
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # -----------------------------------------------------
      # 3. Cache CMake build artifacts & CodeQL database
      # -----------------------------------------------------
      - name: Cache build and CodeQL
        uses: actions/cache@v3
        with:
          path: |
            build
            ~/.codeql
          key: codeql-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp') }}
          restore-keys: codeql-${{ runner.os }}-

      # -----------------------------------------------------
      # 4. Install LLVM 21 and basic build tools
      # -----------------------------------------------------
      - name: Install basic build tools
        run: |
          sudo apt update
          sudo apt install -y tar wget curl xz-utils cmake ninja-build build-essential \
              libedit-dev libcurl4-openssl-dev libffi-dev zlib1g-dev \
              libxml2-dev libtinfo-dev libzstd-dev \
              libboost-system-dev libboost-filesystem-dev libboost-program-options-dev \
              libgc-dev doxygen graphviz

      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - name: Add LLVM 21 to PATH
        run: echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Verify LLVM installation
        run: |
          clang --version
          clang-tidy --version
          llvm-config --version

      # -----------------------------------------------------
      # 5. Initialize CodeQL v3
      # -----------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      # -----------------------------------------------------
      # 6. Configure project and generate compile_commands.json
      # -----------------------------------------------------
      - name: Configure project with CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # -----------------------------------------------------
      # 7. Build project
      # -----------------------------------------------------
      - name: Build project
        run: cmake --build build -j $(nproc)

      # -----------------------------------------------------
      # 8. Perform CodeQL analysis
      # -----------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"


